<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101510"><title>PUFFLOG Reels</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0b100c;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow:hidden}
.header{position:fixed;top:0;left:0;right:0;z-index:10;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;justify-content:space-between;background:linear-gradient(#0b100c,transparent);pointer-events:none}.logo{font-weight:1000}.sub,.hint{font-size:10px;opacity:.65;margin-top:2px}.feed{height:100vh;overflow-y:auto;scroll-snap-type:y mandatory}.reel{position:relative;height:100vh;scroll-snap-align:start;background:#101510}
video{width:100%;height:100%;object-fit:cover;background:#101510}.shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.8),rgba(0,0,0,.12) 45%,transparent 70%);pointer-events:none}
.info{position:absolute;left:16px;right:76px;bottom:calc(24px + env(safe-area-inset-bottom));z-index:3}.user{font-size:15px;font-weight:1000;margin-bottom:6px}.caption{font-size:14px}.tag{display:inline-block;margin-top:9px;padding:5px 9px;border-radius:20px;background:rgba(255,255,255,.15);font-size:10px;font-weight:900}
.actions{position:absolute;right:12px;bottom:calc(28px + env(safe-area-inset-bottom));z-index:4;display:flex;flex-direction:column;gap:10px}.actions button,.mute,.back{border:0;color:#fff;background:rgba(0,0,0,.45);backdrop-filter:blur(8px)}.actions button,.mute{width:46px;height:46px;border-radius:50%;font-size:20px}.mute{position:absolute;right:12px;top:calc(62px + env(safe-area-inset-top));z-index:4}.back{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:20;border-radius:18px;padding:10px 14px;font-weight:900}
</style></head><body>
<header class="header"><div><div class="logo">🌿 PUFFLOG REELS</div><div class="sub">TRACK • REFLECT • CONNECT</div></div><div class="hint">SWIPE ↑</div></header>
<main class="feed" id="feed"></main><button class="back" onclick="history.back()">‹ PUFFLOG</button>
<script>
const reels=[{src:'./reel1.mp4',user:'@pufflog',caption:'Welcome to PUFFLOG 🌿'},{src:'./reel2.mp4',user:'@pufflog',caption:'Track • Reflect • Connect.'},{src:'./reel3.mp4',user:'@pufflog',caption:'Bong Runner • PUFFLOG Original 🎮'}];
const feed=document.getElementById('feed');feed.innerHTML=reels.map(r=>`<section class="reel"><video src="${r.src}" playsinline muted loop preload="metadata"></video><div class="shade"></div><button class="mute">🔇</button><div class="info"><div class="user">${r.user}</div><div class="caption">${r.caption}</div><span class="tag">PUFFLOG REELS</span></div><div class="actions"><button class="like">♡</button><button class="share">↗</button></div></section>`).join('');
document.querySelectorAll('.reel').forEach(card=>{const v=card.querySelector('video'),m=card.querySelector('.mute');m.onclick=()=>{v.muted=!v.muted;m.textContent=v.muted?'🔇':'🔊'};card.querySelector('.like').onclick=e=>e.currentTarget.textContent=e.currentTarget.textContent==='♡'?'♥':'♡';card.querySelector('.share').onclick=async()=>{try{if(navigator.share)await navigator.share({title:'PUFFLOG Reel',text:card.querySelector('.caption').textContent,url:location.href});else{await navigator.clipboard.writeText(location.href);alert('Link copied')}}catch(e){}}});
const io=new IntersectionObserver(es=>es.forEach(x=>{const v=x.target.querySelector('video');if(x.isIntersecting){document.querySelectorAll('video').forEach(a=>{if(a!==v)a.pause()});v.play().catch(()=>{})}else v.pause()}),{threshold:.65});document.querySelectorAll('.reel').forEach(x=>io.observe(x));
</script></body></html>
