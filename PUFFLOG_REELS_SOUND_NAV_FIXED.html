<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080b09">
<title>PUFFLOG REELS</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow:hidden}
.feed{width:100%;height:100%;overflow-y:auto;scroll-snap-type:y mandatory}
.reel{position:relative;width:100%;height:100vh;min-height:100vh;background:#000;scroll-snap-align:start;overflow:hidden}
.reel video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;-webkit-appearance:none;appearance:none}.reel video::-webkit-media-controls{display:none!important}.reel video::-webkit-media-controls-enclosure{display:none!important}
.top{position:fixed;z-index:20;top:0;left:0;right:0;padding:calc(14px + env(safe-area-inset-top)) 18px 18px;display:flex;justify-content:space-between;pointer-events:none;background:linear-gradient(#000c,transparent)}
.logo{font-size:26px;font-weight:900;letter-spacing:-.5px}.sub{font-size:11px;font-weight:700;opacity:.7;margin-top:4px}.swipe{font-size:13px;font-weight:800;opacity:.75;margin-top:8px}
.topPlus{pointer-events:auto;width:42px;height:42px;border:0;background:transparent;color:#fff;font-size:42px;line-height:38px;font-weight:300;padding:0}
.topCenter{display:flex;gap:24px;align-items:center;font-size:24px;margin-left:24px;margin-right:auto}
.topCenter b{opacity:.42}.topCenter .activeTab{opacity:1}
.friendAvatars{display:flex;align-items:center;margin-left:10px}.friendAvatars span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#222;border:2px solid #000;margin-left:-5px;font-size:14px}
.bottomNav{position:fixed;z-index:40;left:0;right:0;bottom:0;height:76px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:rgba(7,10,14,.97);border-top:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:space-around}
.bottomNav .navBtn{border:0;background:transparent;color:#fff;width:20%;height:64px;padding:2px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:16px;font-weight:800}
.bottomNav .navIcon{display:flex;align-items:center;justify-content:center;height:31px;font-size:30px;line-height:30px;font-weight:700}
.bottomNav .navBtn>span:last-child{font-size:15px;font-weight:800;line-height:18px;opacity:.9}
.bottomNav .navBtn.active{opacity:1}
.profileIcon{font-size:29px!important}
.play{display:none!important}
.mute{position:absolute;z-index:7;right:15px;top:calc(72px + env(safe-area-inset-top));width:48px;height:48px;border:0;border-radius:50%;background:#000a;color:#fff;font-size:20px}
.shade{position:absolute;z-index:2;inset:0;pointer-events:none;background:linear-gradient(transparent 45%,transparent 62%,#000d 100%)}
.info{position:absolute;z-index:5;left:18px;right:78px;bottom:calc(30px + env(safe-area-inset-bottom));text-shadow:0 2px 6px #000}
.user{font-size:17px;font-weight:900;margin-bottom:7px}.caption{font-size:15px;font-weight:600}.tag{display:inline-block;margin-top:10px;padding:6px 10px;border-radius:20px;background:#ffffff22;font-size:10px;font-weight:900}
.actions{position:absolute;z-index:7;right:13px;bottom:calc(35px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.actions button{width:48px;height:48px;border:0;border-radius:50%;background:#000a;color:#fff;font-size:23px}

.commentsBtn{position:relative}
.commentBadge{position:absolute;right:-2px;top:-2px;min-width:18px;height:18px;padding:0 5px;border-radius:10px;background:#b5ed58;color:#13230f;font-size:10px;font-weight:900;display:none;align-items:center;justify-content:center}
.commentSheet{position:absolute;z-index:30;left:0;right:0;bottom:0;max-height:58%;padding:14px 16px calc(18px + env(safe-area-inset-bottom));background:rgba(10,14,10,.96);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid rgba(255,255,255,.14);border-radius:24px 24px 0 0;transform:translateY(105%);transition:transform .25s ease;box-shadow:0 -18px 45px rgba(0,0,0,.4)}
.commentSheet.show{transform:translateY(0)}
.commentHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.commentTitle{font-size:16px;font-weight:900}.commentClose{border:0;border-radius:50%;width:36px;height:36px;background:#ffffff16;color:#fff;font-size:20px}
.commentList{max-height:220px;overflow:auto;display:grid;gap:8px;padding-right:2px}
.commentItem{padding:9px 11px;border-radius:13px;background:#ffffff0d;border:1px solid #ffffff0d;font-size:13px;line-height:1.35}
.commentItem b{font-size:12px}.commentTime{opacity:.55;font-size:10px;margin-top:3px}
.commentEmpty{padding:22px 8px;text-align:center;opacity:.65;font-size:13px}
.commentComposer{display:flex;gap:7px;margin-top:10px}.commentComposer input{flex:1;min-width:0;border:1px solid #ffffff20;border-radius:14px;background:#ffffff10;color:#fff;padding:11px 12px;outline:none;font-size:13px}.commentComposer input:focus{border-color:#b5ed58}.commentComposer button{border:0;border-radius:14px;padding:0 14px;background:#b5ed58;color:#13230f;font-weight:900}
.commentLogin{padding:10px 12px;border-radius:13px;background:#ffffff0d;font-size:12px;opacity:.8}

.searchPanel{position:fixed;z-index:60;inset:0;background:rgba(0,0,0,.94);padding:calc(18px + env(safe-area-inset-top)) 18px calc(90px + env(safe-area-inset-bottom));display:none}
.searchPanel.show{display:block}.searchHead{display:flex;gap:10px;align-items:center}.searchInput{flex:1;height:48px;border:1px solid #ffffff25;border-radius:24px;background:#ffffff12;color:#fff;padding:0 18px;font-size:17px;outline:none}.searchClose{width:48px;height:48px;border:0;border-radius:50%;background:#ffffff12;color:#fff;font-size:28px}.searchResults{margin-top:18px;display:grid;gap:10px;max-height:calc(100vh - 150px);overflow:auto}.searchResult{padding:15px;border:1px solid #ffffff14;border-radius:16px;background:#ffffff0a}.searchResult b{font-size:16px}.searchResult span{display:block;margin-top:5px;opacity:.7;font-size:13px}.emptySearch{padding:30px;text-align:center;opacity:.65}.personResult{width:100%;display:flex;align-items:center;gap:12px;text-align:left;color:#fff;font:inherit;cursor:pointer}.personAvatar{width:44px;height:44px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:#222;font-size:22px;flex:0 0 44px}.personAvatar img{width:100%;height:100%;object-fit:cover}
</style>
<style id="pufflog-reels-ui-visibility-fix">
/* UI-only fix: restore the existing Reels + button and bottom Reels navigation. No feed/game/home logic changed. */
.topPlus{display:flex!important;visibility:visible!important;opacity:1!important;position:relative!important;z-index:100!important;pointer-events:auto!important;align-items:center!important;justify-content:center!important;}
.bottomNav{display:flex!important;visibility:visible!important;opacity:1!important;z-index:100!important;}
.bottomNav .navBtn{display:flex!important;visibility:visible!important;opacity:1!important;pointer-events:auto!important;}
</style>
</head>
<body>

<div class="top">
  <button class="topPlus" id="uploadBtn" aria-label="Upload Reel">＋</button>
  <div class="topCenter"><b class="activeTab" id="reelsTab">Reels</b><b id="friendsTab">Friends</b></div>
  <div class="friendAvatars"><span>🌱</span><span>😎</span><span>🔥</span></div>
</div>
<input id="uploadInput" type="file" accept="video/*" hidden>
<div class="searchPanel" id="searchPanel">
  <div class="searchHead"><input id="searchInput" class="searchInput" placeholder="Search PUFFLOG" autocomplete="off"><button class="searchClose" id="searchClose">×</button></div>
  <div class="searchResults" id="searchResults"></div>
</div>

<main class="feed" id="feed"></main>
<nav class="bottomNav" aria-label="PUFFLOG navigation">
  <button class="navBtn" onclick="try{parent.showPUFFLOGPage('home')}catch(e){parent.postMessage({type:'pufflog-nav',page:'home'},'*')}" aria-label="Home">
    <span class="navIcon">⌂</span><span>Home</span>
  </button>
  <button class="navBtn active" aria-label="Reels">
    <span class="navIcon">▶</span><span>Reels</span>
  </button>
  <button class="navBtn" onclick="try{parent.showPUFFLOGPage('dms')}catch(e){parent.postMessage({type:'pufflog-nav',page:'dms'},'*')}" aria-label="DM">
    <span class="navIcon">✈</span><span>DM</span>
  </button>
  <button class="navBtn" id="searchBtn" aria-label="Search">
    <span class="navIcon">⌕</span><span>Search</span>
  </button>
  <button class="navBtn" onclick="try{parent.showPUFFLOGPage('profile')}catch(e){parent.postMessage({type:'pufflog-nav',page:'profile'},'*')}" aria-label="Profile">
    <span class="navIcon profileIcon">◉</span><span>Profile</span>
  </button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://wmmpqbaghfkgruxzgjvm.supabase.co";
const SUPABASE_KEY="sb_publishable_3WMPBKTjhPqLTUC4x48m4Q_jcccIfPE";
const db=window.supabase?.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null;
const files = [
  ["reel1.mp4","Welcome to PUFFLOG 🌿"],
  ["reel2.mp4","Track • Reflect • Connect."],
  ["reel3.mp4","Bong Runner • PUFFLOG Original 🎮"]
];

const feed = document.getElementById("feed");
const uploadBtn = document.getElementById("uploadBtn");
const uploadInput = document.getElementById("uploadInput");
uploadBtn?.addEventListener("click",()=>uploadInput?.click());
uploadInput?.addEventListener("change",()=>{
  const f=uploadInput.files?.[0]; if(!f)return;
  const url=URL.createObjectURL(f);
  const item=[url,f.name.replace(/\.[^.]+$/,'')||'My PUFFLOG Reel'];
  files.unshift(item); renderReels(); uploadInput.value='';
});
const reelRows = new Map();
const esc = v => String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[c]));
const fmtTime = v => { const d=new Date(v); const mins=Math.max(0,Math.floor((Date.now()-d.getTime())/60000)); if(mins<1)return "now"; if(mins<60)return mins+"m"; const h=Math.floor(mins/60); if(h<24)return h+"h"; return Math.floor(h/24)+"d"; };

async function getUser(){
  if(!db)return null;
  const {data:{user}}=await db.auth.getUser();
  currentUser=user||null;
  return currentUser;
}

async function ensureReelRow(item,index){
  if(!db)return null;
  let {data,rowError}=await db.from('reels').select('id,video_url,caption,user_id').eq('video_url',new URL(item[0],document.baseURI).href).maybeSingle();
  if(data){reelRows.set(index,data);return data;}
  if(!currentUser)return null;
  const {data:created}=await db.from('reels').insert({video_url:new URL(item[0],document.baseURI).href,caption:item[1],user_id:currentUser.id}).select('id,video_url,caption,user_id').single();
  if(created)reelRows.set(index,created);
  return created||null;
}

async function getCounts(reelId){
  if(!db||!reelId)return {likes:0,comments:0};
  const [l,c]=await Promise.all([
    db.from('reel_likes').select('id',{count:'exact',head:true}).eq('reel_id',reelId),
    db.from('reel_comments').select('id',{count:'exact',head:true}).eq('reel_id',reelId)
  ]);
  return {likes:l.count||0,comments:c.count||0};
}

async function loadComments(card,reelId){
  const list=card.querySelector('.commentList');
  if(!db||!reelId){list.innerHTML='<div class="commentEmpty">Sign in to load comments.</div>';return;}
  list.innerHTML='<div class="commentEmpty">Loading comments…</div>';
  const {data,error}=await db.from('reel_comments').select('id,body,created_at,user_id').eq('reel_id',reelId).order('created_at',{ascending:false}).limit(40);
  if(error){list.innerHTML='<div class="commentEmpty">Comments unavailable right now.</div>';return;}
  const ids=[...new Set((data||[]).map(x=>x.user_id).filter(Boolean))];
  let names=new Map();
  if(ids.length){const {data:profiles}=await db.from('profiles').select('id,username,display_name').in('id',ids);(profiles||[]).forEach(x=>names.set(x.id,x));}
  list.innerHTML=data?.length?data.map(c=>{const p=names.get(c.user_id);return `<div class="commentItem"><b>@${esc(p?.username||'user')}</b> ${esc(c.body)}<div class="commentTime">${fmtTime(c.created_at)}</div></div>`}).join(''):'<div class="commentEmpty">No comments yet. Be the first 👋</div>';
}

async function refreshStats(card,index){
  const reel=reelRows.get(index); if(!reel)return;
  const st=await getCounts(reel.id);
  card.querySelector('.likeCount').textContent=`♥ ${st.likes}`;
  card.querySelector('.commentCount').textContent=`💬 ${st.comments}`;
  const badge=card.querySelector('.commentBadge'); badge.textContent=st.comments; badge.style.display=st.comments?'flex':'none';
}

async function toggleLike(card,index){
  if(!currentUser){alert('Please sign in to like reels.');return;}
  const reel=reelRows.get(index); if(!reel)return;
  const {data:existing}=await db.from('reel_likes').select('id').eq('reel_id',reel.id).eq('user_id',currentUser.id).maybeSingle();
  if(existing) await db.from('reel_likes').delete().eq('id',existing.id); else await db.from('reel_likes').insert({reel_id:reel.id,user_id:currentUser.id});
  const btn=card.querySelector('.likeBtn'); btn.classList.toggle('liked',!existing); btn.textContent=existing?'♡':'♥';
  await refreshStats(card,index);
}

async function sendComment(card,index){
  if(!currentUser){alert('Please sign in to comment.');return;}
  const reel=reelRows.get(index); if(!reel)return;
  const input=card.querySelector('.commentInput'); const body=input.value.trim().slice(0,300); if(!body)return;
  const {error}=await db.from('reel_comments').insert({reel_id:reel.id,user_id:currentUser.id,body});
  if(error){alert('Comment failed. Please try again.');return;}
  input.value=''; await loadComments(card,reel.id); await refreshStats(card,index);
}

async function openComments(card,index){
  const sheet=card.querySelector('.commentSheet'); sheet.classList.add('show');
  const reel=reelRows.get(index); if(reel)await loadComments(card,reel.id);
  card.querySelector('.commentInput')?.focus();
}

function renderReels(){
  feed.innerHTML=''; reelRows.clear();
  files.forEach((item,index)=>{
  const card=document.createElement("section"); card.className="reel";
  const video=document.createElement("video");
  video.src=new URL(item[0],document.baseURI).href; video.setAttribute("playsinline",""); video.setAttribute("webkit-playsinline",""); video.setAttribute("autoplay",""); video.setAttribute("loop",""); video.preload="auto"; video.muted=(localStorage.getItem('PUFFLOG_REEL_SOUND')!=='on'); video.defaultMuted=video.muted; video.controls=false; video.loop=true; video.removeAttribute("controls");
  const shade=document.createElement("div"); shade.className="shade";
  const mute=document.createElement("button"); mute.className="mute"; mute.textContent="🔇";
  const info=document.createElement("div"); info.className="info"; info.innerHTML='<div class="user">@pufflog</div><div class="caption"></div><span class="tag">PUFFLOG REELS</span>'; info.querySelector('.caption').textContent=item[1];
  const actions=document.createElement("div"); actions.className="actions";
  const like=document.createElement("button"); like.className='likeBtn'; like.textContent="♡";
  const likeCount=document.createElement("span"); likeCount.className='likeCount'; likeCount.textContent='♥ 0';
  like.onclick=()=>toggleLike(card,index);
  const comment=document.createElement("button"); comment.className='commentsBtn'; comment.innerHTML='💬<span class="commentBadge"></span>'; comment.onclick=()=>openComments(card,index);
  const commentCount=document.createElement("span"); commentCount.className='commentCount'; commentCount.textContent='💬 0';
  const share=document.createElement("button"); share.textContent="↗";
  share.onclick=async()=>{try{if(navigator.share)await navigator.share({title:"PUFFLOG Reel",url:video.src});else{await navigator.clipboard.writeText(video.src);alert("Video link copied");}}catch(e){}};
  
  mute.onclick=()=>{video.muted=!video.muted; localStorage.setItem('PUFFLOG_REEL_SOUND',video.muted?'off':'on'); mute.textContent=video.muted?"🔇":"🔊"; if(!video.muted) video.play().catch(()=>{});};
  
  const sheet=document.createElement('div'); sheet.className='commentSheet'; sheet.innerHTML='<div class="commentHead"><div class="commentTitle">Comments</div><button class="commentClose">×</button></div><div class="commentList"><div class="commentEmpty">Loading…</div></div><div class="commentComposer"><input class="commentInput" maxlength="300" placeholder="Write a comment…"><button class="commentSend">Post</button></div>';
  sheet.querySelector('.commentClose').onclick=()=>sheet.classList.remove('show'); sheet.querySelector('.commentSend').onclick=()=>sendComment(card,index); sheet.querySelector('.commentInput').onkeydown=e=>{if(e.key==='Enter')sendComment(card,index)}; sheet.addEventListener('touchstart',e=>e.stopPropagation()); sheet.addEventListener('touchmove',e=>e.stopPropagation());
  const meta=document.createElement('div'); meta.style='position:absolute;z-index:6;right:15px;bottom:calc(140px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:5px;align-items:center'; meta.append(likeCount,commentCount); [likeCount,commentCount].forEach(x=>{x.style='font-size:10px;font-weight:900;text-shadow:0 1px 4px #000'});
  actions.append(like,comment,share); card.append(video,shade,mute,info,actions,meta,sheet); feed.appendChild(card);
  ensureReelRow(item,index).then(()=>refreshStats(card,index));
  });
  const observer=new IntersectionObserver(entries=>{entries.forEach(entry=>{const video=entry.target.querySelector("video");if(entry.isIntersecting){document.querySelectorAll(".reel video").forEach(v=>{if(v!==video)v.pause()});video.muted=(localStorage.getItem('PUFFLOG_REEL_SOUND')!=='on');video.play().catch(()=>{})}else video.pause()})},{threshold:0.65});
  document.querySelectorAll(".reel").forEach(card=>observer.observe(card));
}

async function loadPostedReels(){
  if(!db)return;
  try{
    const {data,error}=await db.from('reels').select('id,video_url,caption,created_at,user_id').order('created_at',{ascending:false}).limit(50);
    if(error||!data?.length)return;
    const existing=new Set(files.map(x=>x[0]));
    const posted=data.filter(r=>r.video_url&&!existing.has(r.video_url)).reverse();
    posted.forEach(r=>files.unshift([r.video_url,r.caption||'PUFFLOG Reel',r.user_id,r.id]));
  }catch(e){console.warn('PUFFLOG reels feed:',e)}
}

(async()=>{await getUser();await loadPostedReels();renderReels();})();

db?.auth.onAuthStateChange((_event,session)=>{currentUser=session?.user||null;document.querySelectorAll('.reel').forEach((card,i)=>{ensureReelRow(files[i],i).then(()=>refreshStats(card,i));});});

const searchPanel=document.getElementById('searchPanel'),searchInput=document.getElementById('searchInput'),searchResults=document.getElementById('searchResults');
async function runSearch(){
  const q=searchInput.value.trim();
  searchResults.innerHTML='<div class="emptySearch">Searching people…</div>';
  if(!db){searchResults.innerHTML='<div class="emptySearch">Search is unavailable right now.</div>';return;}
  let query=db.from('profiles').select('id,username,display_name,avatar_url').order('created_at',{ascending:false}).limit(30);
  if(q) query=query.or(`username.ilike.%${q.replace(/[,()]/g,'')}%,display_name.ilike.%${q.replace(/[,()]/g,'')}%`);
  const {data:people,error}=await query;
  if(error){searchResults.innerHTML='<div class="emptySearch">Could not search people.</div>';return;}
  if(!people?.length){searchResults.innerHTML='<div class="emptySearch">No people found.</div>';return;}
  searchResults.innerHTML=people.map(p=>`<button class="searchResult personResult" data-person="${esc(p.id)}"><div class="personAvatar">${p.avatar_url?`<img src="${esc(p.avatar_url)}">`:'🌱'}</div><div><b>${esc(p.display_name||p.username||'PUFFLOG User')}</b><span>@${esc(p.username||'user')}</span></div></button>`).join('');
  searchResults.querySelectorAll('[data-person]').forEach(btn=>btn.onclick=()=>{
    const id=btn.dataset.person;
    searchPanel.classList.remove('show');
    parent.postMessage({type:'pufflog-person',userId:id},'*');
  });
}
document.getElementById('searchBtn')?.addEventListener('click',()=>{searchPanel.classList.add('show');searchInput.focus();runSearch()});
document.getElementById('searchClose')?.addEventListener('click',()=>searchPanel.classList.remove('show'));
searchInput?.addEventListener('input',runSearch);
document.getElementById('friendsTab')?.addEventListener('click',()=>{document.getElementById('reelsTab').classList.remove('activeTab');document.getElementById('friendsTab').classList.add('activeTab');searchResults.innerHTML='<div class="emptySearch">Friends Reels will appear here when you follow people on PUFFLOG.</div>';searchPanel.classList.add('show')});
document.getElementById('reelsTab')?.addEventListener('click',()=>{document.getElementById('friendsTab').classList.remove('activeTab');document.getElementById('reelsTab').classList.add('activeTab');searchPanel.classList.remove('show')});
</script>
</body>
</html>
