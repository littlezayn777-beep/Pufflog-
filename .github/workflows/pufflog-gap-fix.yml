name: PUFFLOG one-time nav gap fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix four-button navigation spacing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '.appNav{grid-template-columns:repeat(5,1fr)!important}'
          new = '.appNav{grid-template-columns:repeat(4,1fr)!important}'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one target rule, found {s.count(old)}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit only the navigation fix and remove this temporary workflow
        run: |
          git config user.name "PUFFLOG Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/pufflog-gap-fix.yml
          git add index.html
          git commit -m "Fix four-button navigation spacing"
          git push
