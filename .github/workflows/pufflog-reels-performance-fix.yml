name: PUFFLOG Reels Performance Repair
on: push
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Reels feed
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('reels.html')
          s=p.read_text(encoding='utf-8')
          original=s
          s=s.replace('.feed{width:100%;height:100%;overflow-y:auto;scroll-snap-type:y mandatory}', '.feed{width:100%;height:100%;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch}')
          old='''function resolveVideoUrl(raw){if(!raw)return"";if(/^(https?:|blob:|data:)/i.test(raw))return raw;try{const p=db?.storage?.from('reels')?.getPublicUrl(raw)?.data?.publicUrl;if(p)return p;}catch(e){}try{return new URL(raw,document.baseURI).href}catch(e){return raw}}'''
          new='''const playableUrlCache=new Map();
function resolveVideoUrl(raw){if(!raw)return"";if(/^(https?:|blob:|data:)/i.test(raw))return raw;try{return new URL(raw,document.baseURI).href}catch(e){return raw}}
function storagePathFrom(raw){if(!raw)return null;if(!/^(https?:|blob:|data:)/i.test(raw))return raw.replace(/^\\/+/,"");try{const u=new URL(raw,document.baseURI),m='/storage/v1/object/',i=u.pathname.indexOf(m);if(i<0)return null;let rest=u.pathname.slice(i+m.length).replace(/^public\\//,'').replace(/^sign\\//,'').replace(/^authenticated\\//,'');const slash=rest.indexOf('/');if(slash<0||rest.slice(0,slash)!=='reels')return null;return decodeURIComponent(rest.slice(slash+1))}catch(e){return null}}
async function getPlayableUrl(raw){if(!raw)return"";if(/^(blob:|data:)/i.test(raw))return raw;if(playableUrlCache.has(raw))return playableUrlCache.get(raw);const direct=resolveVideoUrl(raw);try{const path=storagePathFrom(raw);if(db&&path){const {data:signed}=await db.storage.from('reels').createSignedUrl(path,3600);if(signed?.signedUrl){playableUrlCache.set(raw,signed.signedUrl);return signed.signedUrl}const {data:pub}=db.storage.from('reels').getPublicUrl(path);if(pub?.publicUrl){playableUrlCache.set(raw,pub.publicUrl);return pub.publicUrl}}}catch(e){console.warn('PUFFLOG video URL:',e)}playableUrlCache.set(raw,direct);return direct}'''
          if old not in s: raise SystemExit('resolve target missing')
          s=s.replace(old,new,1)
          pat=r"function playReel\(video\)\{.*?\nasync function loadPostedReels\(\)"
          m=re.search(pat,s,re.S)
          if not m: raise SystemExit('render target missing')
          block=r'''function playReel(video){if(!video)return;const p=video.play();if(p&&typeof p.catch==='function')p.catch(()=>{})}
async function prepareVideo(video,raw){if(!video||video.dataset.loading==='1'||video.dataset.ready==='1')return;video.dataset.loading='1';const url=await getPlayableUrl(raw);if(!url){video.dataset.loading='';return}video.src=url;video.preload='metadata';video.load();video.dataset.ready='1';video.dataset.loading=''}
async function activateReel(card,index,userGesture=false){const video=card.querySelector('video'),raw=video?.dataset.rawSrc;if(!video||!raw)return;await prepareVideo(video,raw);if(userGesture){video.muted=false;video.removeAttribute('muted')}playReel(video)}
function renderReels(){
feed.innerHTML='';reelRows.clear();const frag=document.createDocumentFragment();
files.forEach((item,index)=>{const card=document.createElement('section');card.className='reel';const video=document.createElement('video');video.setAttribute('playsinline','');video.setAttribute('webkit-playsinline','');video.setAttribute('loop','');video.setAttribute('preload','none');video.setAttribute('loading','lazy');video.controls=false;video.loop=true;video.muted=false;video.defaultMuted=false;video.dataset.rawSrc=item[0];video.addEventListener('error',()=>{if(video.dataset.fallbackTried)return;video.dataset.fallbackTried='1';const direct=resolveVideoUrl(item[0]);if(video.src!==direct){video.src=direct;video.load()}});
const shade=document.createElement('div');shade.className='shade';const info=document.createElement('div');info.className='info';info.innerHTML='<div class="user">@pufflog</div><div class="caption"></div><span class="tag">PUFFLOG REELS</span>';info.querySelector('.caption').textContent=item[1];const actions=document.createElement('div');actions.className='actions';const like=document.createElement('button');like.className='likeBtn';like.textContent='♡';const likeCount=document.createElement('span');likeCount.className='likeCount';likeCount.textContent='♥ 0';like.onclick=()=>toggleLike(card,index);const comment=document.createElement('button');comment.className='commentsBtn';comment.innerHTML='💬<span class="commentBadge"></span>';comment.onclick=()=>openComments(card,index);const commentCount=document.createElement('span');commentCount.className='commentCount';commentCount.textContent='💬 0';const share=document.createElement('button');share.textContent='↗';share.onclick=async()=>{try{if(navigator.share)await navigator.share({title:'PUFFLOG Reel',url:video.src||resolveVideoUrl(item[0])});else{await navigator.clipboard.writeText(video.src||resolveVideoUrl(item[0]));alert('Video link copied')}}catch(e){}};const sheet=document.createElement('div');sheet.className='commentSheet';sheet.innerHTML='<div class="commentHead"><div class="commentTitle">Comments</div><button class="commentClose">×</button></div><div class="commentList"><div class="commentEmpty">Loading…</div></div><div class="commentComposer"><input class="commentInput" maxlength="300" placeholder="Write a comment…"><button class="commentSend">Post</button></div>';sheet.querySelector('.commentClose').onclick=()=>sheet.classList.remove('show');sheet.querySelector('.commentSend').onclick=()=>sendComment(card,index);sheet.querySelector('.commentInput').onkeydown=e=>{if(e.key==='Enter')sendComment(card,index)};sheet.addEventListener('touchstart',e=>e.stopPropagation());sheet.addEventListener('touchmove',e=>e.stopPropagation());const meta=document.createElement('div');meta.style='position:absolute;z-index:6;right:15px;bottom:calc(140px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:5px;align-items:center';meta.append(likeCount,commentCount);[likeCount,commentCount].forEach(x=>{x.style='font-size:10px;font-weight:900;text-shadow:0 1px 4px #000'});actions.append(like,comment,share);card.append(video,shade,info,actions,meta,sheet);card.addEventListener('click',e=>{if(e.target.closest('.actions,.commentSheet,.top,.bottomNav'))return;activateReel(card,index,true)});frag.appendChild(card);if(item[3])reelRows.set(index,{id:item[3],video_url:item[0],caption:item[1],user_id:item[2]})});
feed.appendChild(frag);const observer=new IntersectionObserver(entries=>{entries.forEach(entry=>{const card=entry.target,video=card.querySelector('video');if(entry.isIntersecting){prepareVideo(video,video.dataset.rawSrc);if(entry.intersectionRatio>=0.65){document.querySelectorAll('.reel video').forEach(v=>{if(v!==video)v.pause()});playReel(video)}}else if(video)video.pause()})},{root:feed,rootMargin:'100% 0px',threshold:[0,.65]});feed.querySelectorAll('.reel').forEach(card=>observer.observe(card));const first=feed.querySelector('.reel');if(first)activateReel(first,0,false)}
async function loadPostedReels()'''
          s=s[:m.start()]+block+s[m.end():]
          oldload='''async function loadPostedReels(){if(!db)return;try{const {data,error}=await db.from('reels').select('id,video_url,caption,created_at,user_id').order('created_at',{ascending:false}).limit(50);if(error){console.warn('PUFFLOG reels feed load:',error);return;}if(!data?.length)return;const existing=new Set(files.map(x=>resolveVideoUrl(x[0])));const posted=data.filter(r=>r.video_url&&!existing.has(resolveVideoUrl(r.video_url)));posted.reverse().forEach(r=>files.unshift([resolveVideoUrl(r.video_url),r.caption||'PUFFLOG Reel',r.user_id,r.id]));}catch(e){console.warn('PUFFLOG reels feed:',e)}}'''
          newload='''async function loadPostedReels(){if(!db)return;try{const {data,error}=await db.from('reels').select('id,video_url,caption,created_at,user_id').order('created_at',{ascending:false}).limit(50);if(error){console.warn('PUFFLOG reels feed load:',error);return;}if(!data?.length)return;const existing=new Set(files.map(x=>String(x[0])));const posted=data.filter(r=>r.video_url&&!existing.has(String(r.video_url)));posted.reverse().forEach(r=>files.unshift([r.video_url,r.caption||'PUFFLOG Reel',r.user_id,r.id]));}catch(e){console.warn('PUFFLOG reels feed:',e)}}'''
          if oldload not in s: raise SystemExit('load target missing')
          s=s.replace(oldload,newload,1)
          oldauth='''db?.auth.onAuthStateChange(async(_event,session)=>{currentUser=session?.user||null;if(session?.user){await loadPostedReels();renderReels();}else{document.querySelectorAll('.reel').forEach((card,i)=>{ensureReelRow(files[i],i).then(()=>refreshStats(card,i));});}});'''
          newauth='''db?.auth.onAuthStateChange(async(_event,session)=>{currentUser=session?.user||null;if(session?.user){await loadPostedReels();renderReels();}});'''
          if oldauth not in s: raise SystemExit('auth target missing')
          s=s.replace(oldauth,newauth,1)
          if s==original: raise SystemExit('no changes')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reels.html
          git rm .github/workflows/pufflog-reels-performance-fix.yml
          git commit -m 'Fix Reels playback loading and mobile performance'
          git push
