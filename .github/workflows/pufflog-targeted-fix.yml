name: PUFFLOG targeted UI fix
on:
  push:
    paths:
      - '.github/workflows/pufflog-targeted-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Home fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          for a,b in [('\\n<style','<style'),('\\n<script','<script'),('</style>\\n','</style>'),('</script>\\n','</script>'),('\\n</style>','</style>'),('\\n</script>','</script>'),('\\n</body>','</body>')]: s=s.replace(a,b)
          marker='id="pufflog-home-gap-final-v3"'
          if marker not in s:
              fix=r'''
<style id="pufflog-home-gap-final-v3">
#pufflogSocialHome{min-height:0!important;height:auto!important;margin-bottom:0!important;overflow:visible!important}
#pufflogHomePosts{margin:8px 0 110px!important;padding:0 2px!important}
</style>
<script id="pufflog-home-gap-final-v3-js">
(function(){
function fix(){
 var home=document.getElementById('pufflogSocialHome'),posts=document.getElementById('pufflogHomePosts'),game=document.getElementById('gamePage');
 if(home&&posts&&posts.parentNode!==home)home.appendChild(posts);
 if(posts){var b=document.querySelector('.appNav button.active[data-page]'),page=b?.dataset?.page||'home';posts.style.display=(page==='home'||page==='profile')&&!game?.classList.contains('activePage')?'':'none';}
 Array.from(document.body.childNodes).forEach(function(n){if(n.nodeType===3&&/^\\s*\\n(?:\\s*\\n)?\\s*$/.test(n.nodeValue||''))n.remove();});
}
window.addEventListener('load',function(){fix();setTimeout(fix,200);setTimeout(fix,800);setTimeout(fix,1500)});
document.addEventListener('click',function(){setTimeout(fix,0);setTimeout(fix,120)},true);
new MutationObserver(fix).observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class','style']});
setInterval(fix,1000);
})();
</script>
'''
              s=s.replace('</body>',fix+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'PUFFLOG Home and Bong Runner fix applied' || true
          git rm .github/workflows/pufflog-targeted-fix.yml || true
          git commit -m 'Remove one-time PUFFLOG targeted fix workflow' || true
          git push