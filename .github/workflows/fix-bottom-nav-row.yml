name: Fix PUFFLOG bottom navigation row

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-bottom-nav-row.yml'

permissions:
  contents: write

jobs:
  fix-nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force all five navigation buttons onto one row
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<style id="pufflog-bottom-nav-one-row">'
          if marker in s:
              raise SystemExit(0)
          css = '''
<style id="pufflog-bottom-nav-one-row">
.bottom{
  display:grid!important;
  grid-template-columns:repeat(5,minmax(0,1fr))!important;
  align-items:end!important;
  justify-items:stretch!important;
  justify-content:stretch!important;
  gap:0!important;
  width:100%!important;
  left:0!important;
  right:0!important;
  padding-left:6px!important;
  padding-right:6px!important;
}
.bottom button{
  display:flex!important;
  width:100%!important;
  min-width:0!important;
  max-width:none!important;
  flex:none!important;
  margin:0!important;
  align-items:center!important;
  justify-content:center!important;
}
</style>
'''
          s = s.replace('</head>', css + '</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit navigation fix
        shell: bash
        run: |
          git config user.name 'PUFFLOG GitHub Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix bottom navigation to one row'
          git push
