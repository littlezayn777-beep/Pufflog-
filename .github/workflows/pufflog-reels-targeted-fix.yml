name: PUFFLOG targeted reels fix
on:
  push:
    paths:
      - "__pufflog_reels_patch_trigger.txt"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only reels.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('reels.html')
          s=p.read_text()
          original=s
          s=s.replace('.info{position:absolute;z-index:5;left:18px;right:78px;bottom:calc(30px + env(safe-area-inset-bottom));', '.info{position:absolute;z-index:5;left:18px;right:78px;bottom:calc(110px + env(safe-area-inset-bottom));')
          s=s.replace('.actions{position:absolute;z-index:7;right:13px;bottom:calc(35px + env(safe-area-inset-bottom));', '.actions{position:absolute;z-index:7;right:13px;bottom:calc(110px + env(safe-area-inset-bottom));')
          marker='.commentBadge{position:absolute;right:-2px;top:-2px;'
          if '#feed .likeCount,#feed .commentCount{display:none!important}' not in s:
              s=s.replace(marker, '#feed .likeCount,#feed .commentCount{display:none!important}\n'+marker, 1)
          old='const video=document.createElement("video");video.src=item[0];video.load();video.setAttribute("playsinline","");video.setAttribute("webkit-playsinline","");video.setAttribute("autoplay","");video.setAttribute("loop","");video.preload="auto";video.muted=false;video.defaultMuted=false;video.controls=false;video.loop=true;video.removeAttribute("controls");video.addEventListener("loadedmetadata",()=>video.play().catch(()=>{}));video.addEventListener("canplay",()=>video.play().catch(()=>{}));'
          new='const video=document.createElement("video");const sourceUrl=/^(https?:|blob:|data:)/i.test(item[0])?item[0]:new URL(item[0],document.baseURI).href;video.src=sourceUrl;video.setAttribute("playsinline","");video.setAttribute("webkit-playsinline","");video.setAttribute("autoplay","");video.setAttribute("loop","");video.preload="auto";video.muted=false;video.defaultMuted=false;video.controls=false;video.loop=true;video.removeAttribute("controls");const safePlay=()=>video.play().catch(()=>{video.muted=true;video.play().catch(()=>{})});video.addEventListener("loadedmetadata",safePlay);video.addEventListener("canplay",safePlay);card.addEventListener("pointerdown",()=>{video.muted=false;video.play().catch(()=>{})},{passive:true});'
          if old not in s:
              raise SystemExit('expected video block not found; aborting')
          s=s.replace(old,new,1)
          if s==original:
              raise SystemExit('no changes made; aborting')
          p.write_text(s)
          PY
          git config user.name "PUFFLOG Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reels.html
          git commit -m "Fix reels video display and caption layout"
          git push
      - name: Remove temporary patch files
        run: |
          rm -f __pufflog_reels_patch_trigger.txt .github/workflows/pufflog-reels-targeted-fix.yml
          git config user.name "PUFFLOG Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary reels patch runner"
          git push
