name: Remove Reels navigation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/remove-reels-navigation.yml'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Reels from Home and fix four-button navigation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove a Reels navigation button if one is present.
          s = re.sub(r'<button[^>]*data-page=["\']reels["\'][^>]*>.*?</button>', '', s, flags=re.I | re.S)

          # Keep the four-button navigation evenly distributed.
          s = re.sub(r'\.appNav\{[^}]*grid-template-columns:repeat\(5[^}]*\}',
                     '.appNav{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:0!important;width:100%!important;left:0!important;right:0!important}', s)
          s = re.sub(r'\.appNav\{grid-template-columns:repeat\(5,minmax\(0,1fr\)\)!important;gap:2px!important;width:100%!important;left:0!important;right:0!important;padding-left:5px!important;padding-right:5px!important\}',
                     '.appNav{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:0!important;width:100%!important;left:0!important;right:0!important;padding-left:5px!important;padding-right:5px!important}', s)

          # Remove all Reel cards/sections from the Home presentation only.
          marker = '<style id="pufflog-home-no-reels">'
          if marker not in s:
              s += '''\n<style id="pufflog-home-no-reels">\n/* PUFFLOG: Home is posts/tools only — no Reels surface. */\n#pufflogSocialHome .pshHeroReel,\n#pufflogSocialHome .pshHomeFeed,\n#pufflogSocialHome .pshTrending,\n#pshHomeFeed,\n#pshTrending,\n.pshFeedReel,\n.pshHeroReel{display:none!important}\n.appNav{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:0!important;width:100%!important;left:0!important;right:0!important}\n.appNav button{width:100%!important;min-width:0!important}\n</style>\n'''

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit if changed
        shell: bash
        run: |
          git config user.name 'PUFFLOG GitHub Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix four-button navigation and remove home reels'
          git push
