name: Load PUFFLOG Supabase client
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inject:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inject client script once
        shell: bash
        run: |
          if ! grep -q 'supabase-client.js' index.html; then
            python3 - <<'PY'
from pathlib import Path
p = Path('index.html')
s = p.read_text(encoding='utf-8')
needle = '</head>'
if needle not in s:
    raise SystemExit('No </head> found; refusing to modify index.html')
s = s.replace(needle, '<script src="supabase-client.js"></script></head>', 1)
p.write_text(s, encoding='utf-8')
PY
            git config user.name 'PUFFLOG Bot'
            git config user.email 'actions@github.com'
            git add index.html
            git commit -m 'Connect PUFFLOG to Supabase client'
            git push
          fi
