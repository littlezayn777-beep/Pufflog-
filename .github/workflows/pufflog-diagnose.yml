name: Diagnose PUFFLOG profile
on:
  push:
    paths:
      - '.github/workflows/pufflog-diagnose.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect target functions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          for key in ['function loadIGProfile','function renderIGGrid','function renderLocalPosts','pufflogHomePosts','data-igtab="reels"']:
              p=s.find(key)
              print(f'\\n===== {key} @ {p} =====\\n')
              if p>=0: print(s[max(0,p-1200):p+6500])
          PY
