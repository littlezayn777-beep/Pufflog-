name: Diagnose PUFFLOG profile
on:
  push:
    paths:
      - '.github/workflows/pufflog-diagnose.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact profile and post code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          for a,b in [(157000,161500),(173500,177500),(199000,208000),(138000,146500)]:
              print(f'\\n===== RANGE {a}:{b} =====\\n')
              print(s[a:b])
          PY
