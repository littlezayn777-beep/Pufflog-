name: Finish Home Posts Visibility Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-post-visibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restrict uploaded posts to Home and Profile
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'pufflog-post-visibility-fix-v1'
          if marker in s:
              print('Visibility fix already present')
              raise SystemExit(0)

          css = r'''\n<style id="pufflog-post-visibility-fix-v1">\n/* Uploaded post cards belong only to Home and Profile. */\n#pufflogHomePosts.pufflog-hide-uploaded-posts{display:none!important}\n</style>\n'''

          js = r'''\n<script id="pufflog-post-visibility-fix-v1-js">\n(function(){\n  'use strict';\n  function setUploadedPostVisibility(page){\n    const posts=document.getElementById('pufflogHomePosts');\n    if(!posts)return;\n    const visible=page==='home'||page==='profile';\n    posts.classList.toggle('pufflog-hide-uploaded-posts',!visible);\n  }\n  const original=window.showPUFFLOGPage;\n  if(typeof original==='function' && !original.__pufflogPostVisibilityFix){\n    const wrapped=function(page){\n      original.apply(this,arguments);\n      setUploadedPostVisibility(page);\n    };\n    wrapped.__pufflogPostVisibilityFix=true;\n    window.showPUFFLOGPage=wrapped;\n  }\n  document.addEventListener('click',function(e){\n    const b=e.target.closest?.('button[data-page]');\n    if(b)setTimeout(()=>setUploadedPostVisibility(b.dataset.page),0);\n  },true);\n  const observer=new MutationObserver(()=>{\n    const posts=document.getElementById('pufflogHomePosts');\n    if(!posts)return;\n    const active=document.querySelector('.appNav button.active[data-page]');\n    const page=active?.dataset.page||'home';\n    setUploadedPostVisibility(page);\n  });\n  observer.observe(document.body,{subtree:true,childList:true});\n  setTimeout(()=>setUploadedPostVisibility('home'),0);\n  setTimeout(()=>{\n    const active=document.querySelector('.appNav button.active[data-page]');\n    setUploadedPostVisibility(active?.dataset.page||'home');\n  },800);\n})();\n</script>\n'''

          if '</head>' not in s or '</body>' not in s:
              raise SystemExit('Unexpected index.html structure')
          s = s.replace('</head>', css + '</head>', 1)
          s = s.replace('</body>', js + '</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'PUFFLOG GitHub Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/finish-posts-step.yml
          git commit -m 'Apply uploaded post visibility fix'
          git push
