name: PUFFLOG cleanup now
on: push
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='id="pufflog-artifact-cleaner"'
          if marker not in s:
            fix='''\n<script id="pufflog-artifact-cleaner">\n(function(){\n  function clean(){\n    var w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT),a=[];\n    while(w.nextNode())a.push(w.currentNode);\n    a.forEach(function(n){\n      var v=n.nodeValue||\"\";\n      if(v.indexOf(\"document.open();document.write\")>=0||v.indexOf(\"PUFFLOG is loading...\")>=0||v.indexOf(\"String(e)\")>=0){n.remove();return;}\n      n.nodeValue=v.replace(/\\\\[nr]/g,\"\");\n      if(!n.nodeValue.trim())n.remove();\n    });\n  }\n  if(document.readyState===\"loading\")document.addEventListener(\"DOMContentLoaded\",clean);else clean();\n  window.addEventListener(\"load\",clean);\n  new MutationObserver(clean).observe(document.documentElement,{subtree:true,childList:true});\n})();\n</script>\n'''
            s=s.replace('</body>',fix+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Clean visible newline artifacts in PUFFLOG' || true
          git push
