name: PUFFLOG fix uploaded post scope
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[pufflog-auto-fix]') || github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          original=s
          s=re.sub(r'\\n<script id="pufflog-home-posts-js">.*?\\n</script>', '', s, flags=re.S)
          s=re.sub(r'\\n<style id="pufflog-post-visibility-fix-v1">.*?\\n</style>', '', s, flags=re.S)
          s=re.sub(r'\\n<script id="pufflog-post-visibility-fix-v1-js">.*?\\n</script>', '', s, flags=re.S)
          s=re.sub(r'\\\\n(?=<(?:style|script|/style|/script|/head|/body|div|section|nav|main|html))', '\n', s)
          marker='</body></html>'
          guard='''
<style id="pufflog-local-post-scope-fix">
#pufflogHomePosts{display:none!important}
#pufflogHomePosts.pufflog-local-home-visible{display:block!important}
</style>
<script id="pufflog-local-post-scope-fix-js">
(function(){
  const root=()=>document.getElementById('pufflogHomePosts');
  function page(){const a=document.querySelector('.appNav button.active[data-page]');return a?a.dataset.page:'home';}
  function apply(){const r=root();if(!r)return;r.classList.toggle('pufflog-local-home-visible',page()==='home');}
  const old=window.showPUFFLOGPage;
  if(typeof old==='function'&&!old.__pufflogLocalScopeFix){
    const wrapped=function(p){const result=old.apply(this,arguments);setTimeout(apply,0);return result};
    wrapped.__pufflogLocalScopeFix=true;window.showPUFFLOGPage=wrapped;
  }
  document.addEventListener('click',e=>{const b=e.target.closest?.('.appNav button[data-page]');if(b)setTimeout(apply,0)},true);
  new MutationObserver(apply).observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});
  window.addEventListener('load',()=>{setTimeout(apply,500);setTimeout(apply,1500)});
})();
</script>
'''
          if 'id="pufflog-local-post-scope-fix-js"' not in s:
              s=s.replace(marker,guard+marker)
          if s != original:
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix PUFFLOG post visibility and n-n artifact [pufflog-auto-fix]"
          git push
