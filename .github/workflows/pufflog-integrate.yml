name: PUFFLOG backend integration
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject backend scripts without changing UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tags = ['<script src="supabase-client.js"></script>', '<script src="pufflog-backend.js"></script>']
          missing = [t for t in tags if t not in s]
          if not missing:
              print('Backend scripts already integrated; nothing to do.')
              raise SystemExit(0)
          anchor = '</body>' if '</body>' in s else '</html>'
          injection = '\n' + '\n'.join(missing) + '\n'
          if anchor not in s:
              raise SystemExit('Could not find a safe HTML closing tag; no changes made.')
          s = s.replace(anchor, injection + anchor, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Connect PUFFLOG frontend to Supabase backend'
          git push
